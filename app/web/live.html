    }, LIVE_ORPHAN_MS);
  }

  /* A partial: replace-in-place by segId, never appended, never remembered (the app never replays one). SILENT for
     the resume pill: it is the same sentence being refined -- only a FINAL counts as something new to have missed. */
  function applyPartial(msg) {
    const segId = segIdOf(msg && msg.segId);
    if (!segId) return;            // no identity, no replace-in-place: refuse rather than append
    live = { segId, t: msg.t, lang: String(msg.lang || ""),
             src: String(msg.src || ""), dst: String(msg.dst || ""),
             // omitted when there is no draft at all -- an empty dst has no language
             dstLang: String(msg.dstLang || "") };
    livePaint(live);
    liveArm();
    if (pinned) pin();
  }

  function atBottom() {
    const sh = el.log.scrollHeight || 0, ch = el.log.clientHeight || 0;
    if (!sh || !ch) return true;
    return sh - (el.log.scrollTop || 0) - ch < 40;
  }
  function pin() { try { el.log.scrollTop = el.log.scrollHeight || 0; } catch { /* no layout */ } }
  function refreshResume() { el.resume.hidden = pinned; }

  function clearLog() {
    lines.length = 0; seen.clear();
    liveClear();                    // ...the sentence in flight goes with the rest
    twForget();                     // ...and so does what this session had measured of the cadence
    el.log.replaceChildren();
    rows = 0;
    pinned = true; refreshResume();
  }

  // The palette, as hexes (the :root --spk-1..6 above). spk.color may be the hex itself or a 0-based INDEX into it
  // (the app sends the index): resolving both keeps the six values defined in one place.
  const SPEAKER_COLORS = ["#c97c64", "#81972b", "#309da9", "#5e5ad3", "#944baf", "#bf367f"];
  const colorOf = (c) => {
    if (typeof c === "number" && isFinite(c))
      return SPEAKER_COLORS[((c % SPEAKER_COLORS.length) + SPEAKER_COLORS.length) % SPEAKER_COLORS.length];
    const s = String(c == null ? "" : c).trim();
    if (/^#[0-9a-fA-F]{3,8}$/.test(s)) return s;
    if (/^\d+$/.test(s)) return SPEAKER_COLORS[Number(s) % SPEAKER_COLORS.length];
    return "";
  };

  /* ---- THE ENGINE'S STATE, as the app last said it ----
     mode/langA/langB = the LIVE pair (the app sends the live pair to this page: one pair per mode), defaulted to the
     two languages this feature was built for, so the bar never reads "· → ·". presetReq = what the user ASKED for
     ("" = never chose), preset = what the engine resolved it to. sessionLines = how many finished lines the SESSION
     FILE holds (what an export would contain), not how many are on screen. */
  let trState = { running: false, status: "", preset: "", presetReq: "", asr: "", mt: "", gpu: false,
                  err: "", mode: "auto", langA: "en", langB: "zh", sessionLines: 0, spkOn: false, speakers: 0 };
  const nowMs = twNow;

  /* ---- the acknowledgement: the export's answer, and the app's warnings ----
     The status line is borrowed for a few seconds rather than given a banner of its own: a second strip appearing
     would move the dialogue. `ack` outranks the status while it lasts, and the timer is single. */
  let ack = null, ackTimer = null;
  function showAck(text, isError, ms) {
    ack = { text, isError };
    if (ackTimer) clearTimeout(ackTimer);
    ackTimer = setTimeout(() => { ack = null; ackTimer = null; paintState(); }, ms);
    wake();          // an ack the idle fade had already hidden would be an ack nobody saw
    paintState();
  }

  /* RV4-4 (the player's review, 23/10): an engine that is NOT running -- its first start, a death and its restart, a
     spawn that keeps failing -- reads "starting…" while a start is plausible, then "engine not running" (red) once
     it has been down ENGINE_DOWN_MS. "loading models…" is said only of an engine that IS running. */
  const ENGINE_DOWN_MS = 15000;
  let engineDownSince = 0, engineDownTimer = null;
  function noteEngineRunning(running) {
    if (running) {
      engineDownSince = 0;
      if (engineDownTimer) { clearTimeout(engineDownTimer); engineDownTimer = null; }
    } else if (!engineDownSince) {
      engineDownSince = nowMs() || 1;
      engineDownTimer = setTimeout(() => { engineDownTimer = null; paintState(); }, ENGINE_DOWN_MS + 50);
    }
  }
  // RV4-2: `models` as the app sends it -- an OBJECT {asr, mt} -- or a string (an older sender, the mock).
  const shortModel = (m) => cleanName(String(m || "").replace(/^ggml-/i, "").replace(/\.(bin|gguf)$/i, "")
    .replace(/-Instruct.*$/i, ""), 60);
  const asrLabel = (m) => cleanName(String(m || "").split(/\s*→\s*/).map(shortModel).filter(Boolean).join(" → "), 80);

  /* THE STATE LINE: what the engine is doing, then what it runs on -- "listening · small → turbo · Qwen3-4B · GPU ·
     2 inputs · 3 voices". "listening" is said ONLY while the app says the live path runs (the engine's own word
     also covers its idle state, and a window that said "listening" with every microphone closed would be lying). */
  const plural = (n, one, many) => n + " " + (n === 1 ? one : many);
  function stateText() {
    const s = trState.status;
    if (s === "error") return { text: trState.err ? "error — " + cleanNotice(trState.err) : "error", cls: "error" };
    if (s === "off") return { text: "engine off", cls: "" };
    if (!trState.running) {
      const gone = engineDownSince > 0 && nowMs() - engineDownSince >= ENGINE_DOWN_MS;
      return gone ? { text: "engine not running", cls: "error" } : { text: "starting…", cls: "loading" };
    }
    if (s === "loading") return { text: "loading models…", cls: "loading" };
    // THE DRAIN (the ADDENDUM FIX ROUND): Listen is off -- the microphones are closed -- but the engine is still turning
    // what it heard into lines (live.on stays true until it is done): they keep coming, and the window says why.
    if (onAir && !wanted) return { text: "Finishing the last sentences…", cls: "loading" };
    // R4: asked, not confirmed yet -- unless the engine said why it will not (RVB-5: a refusal is never "starting" for ever)
    if (!onAir && wanted) return trState.err ? { text: "could not listen — " + cleanNotice(trState.err), cls: "error" }
                                             : { text: "starting to listen…", cls: "loading" };
    const head = onAir ? (s === "transcribing" ? "transcribing…" : "listening")
                       : (s === "analyzing" ? "analysing a film" : "not listening");
    const parts = [head];
    if (trState.asr) parts.push(trState.asr);
    if (trState.mt) parts.push(trState.mt);
    if (trState.asr || trState.mt) parts.push(trState.gpu ? "GPU" : "CPU");
    if (onAir) parts.push(plural(strips.length, "input", "inputs"));
    if (onAir && trState.spkOn && trState.speakers > 0) parts.push(plural(trState.speakers, "voice", "voices"));
    return { text: parts.join(" · "), cls: onAir ? (s === "transcribing" ? "transcribing" : "listening") : "" };
  }
  function paintState() {
    const st = ack ? { text: ack.text, cls: ack.isError ? "error" : "" } : stateText();
    if (el.state.textContent !== st.text) el.state.textContent = st.text;
    ["is-loading", "is-listening", "is-transcribing", "is-error"].forEach((c) => el.state.classList.remove(c));
    if (st.cls) el.state.classList.add("is-" + st.cls);
    // the whole sentence as the tooltip too (a narrow window cuts it short)
    el.state.title = st.text;
  }

  // The tooltip says what the button would ACTUALLY save, so a reader can tell "nothing yet" from "the whole meeting".
  function paintExport() {
    const n = Number(trState.sessionLines) || 0;
    el.exportBtn.title = "Save the whole session as a Word document (.docx)"
      + (n > 0 ? " — " + n + (n === 1 ? " line" : " lines") : " — nothing recorded yet");
  }

  /* =========================================================================================================
     THE SOURCE PLATE -- the strips, the picker, Listen, the meters.
     The APP is the authority on the strips (it validates them like the engine does, keeps them in app.txt, and
     sends them back as translatorState.live.inputs): this page edits OPTIMISTICALLY, sends liveConfig with the whole
     set, and the echo WINS -- except over the control under the user's hand (a name being typed, a trim being
     dragged), and except for a short PENDING window after each edit: an echo the app had already posted before it
     read ours would otherwise put the old set back for a moment (a just-added strip blinking out and in).
     ========================================================================================================= */
  const MAX_STRIPS = 4;         // TrPipe.h kMaxLiveInputs
  const MAX_CHAN = 8;           // TrPipe.h kLiveMaxChan (0 = the mix)
  const GAIN_MIN = -24, GAIN_MAX = 24, GAIN_STEP = 0.5;   // TrPipe.h kLiveGainMinDb / kLiveGainMaxDb
  const PENDING_MS = 1500;      // how long an edit may wait for its echo before the app's word stands
  const LISTEN_PENDING_MS = 6000;
  const TRIM_SEND_MS = 200;     // a trim being dragged reaches the app at most this often (the meter answers it)
  const KINDS = { in: "Input", out: "Sound of an output", app: "Application", wav: "Test file" };
  const KIND_TAG = { in: "In", out: "Out", app: "App", wav: "Wav" };
  // A key's kind -- and no key at all when it holds a '|' (fix round, the ADDENDUM's RVA-10): '|' is the LANE separator
  // ("<key>|<chan>", TrPipe.h liveLaneId), so "in:X|1" next to "in:X" channel 1 would name two strips alike. Refused
  // here as by the app and the engine: such a source is never listed, never a strip, never sent.
  const kindOf = (key) => { const s = String(key || ""); const m = /^(in|out|app|wav):./.exec(s); return m && s.indexOf("|") < 0 ? m[1] : ""; };
  const clampGain = (g) => {
    const v = Math.round((Number(g) || 0) * 10) / 10;
    return Math.max(GAIN_MIN, Math.min(GAIN_MAX, v)) || 0;     // (|| 0: never a -0 on the wire)
  };
  const fmtGain = (g) => { const v = clampGain(g); return (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v).toFixed(1) + " dB"; };

  let onAir = false;            // the engine listens: translatorState.live.on, the ECHO -- nothing else lights it
  let wanted = false;           // the app WANTS it to (translatorState.live.wanted; absent = as `on`): on !== wanted =
                                // starting or stopping -- the Listen dot blinks, and a second press cancels
  let strips = [];              // [{uid, key, lane?, label, chan, gainDb, state, why}] -- in the app's order
  let uidSeq = 0;
  let pending = null;           // {sent:[wire inputs], until} -- the last liveConfig, until its echo lands
  let pendingTimer = null;      // ends the pending window ON TIME (the app answers a refused edit ONCE: R4)
  let heldLive = null;          // the last translatorState.live that arrived inside the pending window
  let listenPending = null;     // {on, until} -- Listen pressed, until the echo says so
  let listenTimer = null;
  let sources = null;           // the engine's list {gen, list:[...]} -- the latest that arrived
  let trimLive = null;          // {uid, v} -- a trim being moved (input events), not yet committed
  let trimTimer = null;
  let dragUid = 0;              // the strip whose trim the pointer holds

  /* What a strip's source IS (its name, its channel count) is known from the engine's list -- which this page only
     asks for when the picker opens. So the last-known name and channel count of each strip's source are kept in
     the profile (a convenience of this window's, never authority): after a restart the strips still show
     "Line (Studio Interface)" and offer its six channels, before anyone has opened the picker. */
  const KEY_SRC = "suvtitle.live.sources";
  const SRC_CACHE_MAX = 12;
  const srcInfo = new Map();    // key -> {label, ch}
  try {
    const o = JSON.parse(read(KEY_SRC, "{}"));
    if (o && typeof o === "object")
      Object.keys(o).slice(0, SRC_CACHE_MAX).forEach((k) => {
        const v = o[k];
        if (kindOf(k) && Array.isArray(v)) srcInfo.set(k, { label: cleanName(v[0], 120), ch: Math.max(0, Math.min(64, parseInt(v[1], 10) || 0)) });
      });
  } catch { /* a damaged value: nothing known */ }
  function rememberSource(src) {
    if (!src || !kindOf(src.key)) return;
    const was = srcInfo.get(src.key);
    if (was && was.label === src.label && was.ch === src.ch) return;
    srcInfo.delete(src.key);
    srcInfo.set(src.key, { label: src.label, ch: src.ch });
    // bounded: the strips' sources first, then the most recent
    while (srcInfo.size > SRC_CACHE_MAX) {
      const drop = [...srcInfo.keys()].find((k) => !strips.some((s) => s.key === k));
      srcInfo.delete(drop !== undefined ? drop : srcInfo.keys().next().value);
    }
    const o = {};
    srcInfo.forEach((v, k) => { o[k] = [v.label, v.ch]; });
    write(KEY_SRC, JSON.stringify(o));
  }
  const sourceOf = (key) => (sources ? sources.list.find((x) => x.key === key) : null) || null;
  function sourceName(key) {
    const cur = sourceOf(key), known = srcInfo.get(key);
    const n = (cur && cur.label) || (known && known.label);
    if (n) return n;
    const k = kindOf(key);
    if (k === "app" || k === "wav") return cleanName(String(key).slice(k.length + 1).split(/[\\/]/).pop(), 120);
    return KINDS[k] || "Source";
  }
  function channelsOf(key) {
    const cur = sourceOf(key), known = srcInfo.get(key);
    const ch = (cur && cur.ch > 0) ? cur.ch : (known && known.ch > 0 ? known.ch : 0);
    return Math.min(MAX_CHAN, ch);
  }

  // THE RULE (TrPipe.h unpackLive): one key twice only with two different channels >= 1 -- never twice on one
  // channel, never a channel next to its own mix.
  const clash = (list, key, chan, exceptUid) =>
    list.some((s) => s.uid !== exceptUid && s.key === key && (s.chan === chan || s.chan === 0 || chan === 0));
  const wireOf = (s) => ({ key: s.key, label: s.label, chan: s.chan, gainDb: clampGain(s.gainDb) });
  const sameWire = (a, b) => a.length === b.length && a.every((x, i) => x.key === b[i].key && x.chan === b[i].chan
    && x.label === b[i].label && Math.abs(x.gainDb - b[i].gainDb) < 0.05);

  // A STRIP'S NAME ON THE WIRE (TrPipe.h LANES, R1) -- what its meter (liveLevels) and its speaker (spk.slot) go by: the
  // app's echo says it (live.inputs[].lane); a strip the echo has not named yet (just added, its channel just changed) is
  // named by the same rule, BUILT from {key, chan} and never parsed back: the key for a mix strip, "<key>|<chan>" for a
  // one-channel strip. Never the key alone for a channel: "canal 1 = moi, canal 2 = l'invité" are two strips.
  const laneRule = (key, chan) => (chan ? key + "|" + chan : key);
  const laneOf = (s) => s.lane || laneRule(s.key, s.chan);

  // One input of the echo, read defensively (the app validated it; a page must still not paint garbage).
  function inputOf(x) {
    if (!x || typeof x !== "object" || !kindOf(x.key)) return null;
    const chan = Math.round(Number(x.chan) || 0);
    const lane = typeof x.lane === "string" && x.lane.length <= 600 ? x.lane : "";   // a key <= 512 bytes + "|8"
    return { key: String(x.key), lane, label: cleanLabel(x.label), chan: chan >= 0 && chan <= MAX_CHAN ? chan : 0,
             gainDb: clampGain(x.gainDb), state: String(x.state || "").toLowerCase(), why: cleanNotice(x.why) };
  }

  // THE EDIT: the new set, painted at once, sent WHOLE (0..4 strips), pending until its echo.
  function commitStrips(next) {
    strips = next;
    const inputs = strips.map(wireOf);
    pending = { sent: inputs, until: nowMs() + PENDING_MS };
    if (pendingTimer) clearTimeout(pendingTimer);
    pendingTimer = setTimeout(pendingOver, PENDING_MS);
    paintStrips();
    paintPicker();
    paintState();
    send({ type: "liveConfig", inputs });
  }

  // The pending window is over: the app's last word held meanwhile stands now -- a REFUSED edit (R4: a warn, and the
  // previous strips re-sent ONCE) goes back to what the app keeps, with no further message needed.
  function pendingOver() {
    pendingTimer = null;
    const lv = heldLive;
    heldLive = null;
    // its strips, with what is true NOW of listening (a later state may have moved `on` without listing the strips)
    if (pending && lv) applyLive(Object.assign({}, lv, { on: onAir, wanted }));
  }

  // THE ECHO: translatorState.live.
  function applyLive(lv) {
    const was = onAir, wasWanted = wanted;
    onAir = lv.on === true;
    wanted = typeof lv.wanted === "boolean" ? lv.wanted : onAir;
    if (listenPending && listenPending.on === onAir) endListenPending();
    // no `inputs` at all = not reported (the strips stand); an EMPTY list = no strip
    const echo = Array.isArray(lv.inputs) ? lv.inputs.map(inputOf).filter(Boolean).slice(0, MAX_STRIPS) : null;
    if (pending && echo) {
      if (sameWire(echo.map(wireOf), pending.sent)) pending = null;   // our edit landed
      else if (!(nowMs() < pending.until)) pending = null;            // waited long enough: the app's word stands
    }
    if (!echo) {
      /* the strips as they are */
    } else if (pending) {
      // our set stands a moment longer; only what the ENGINE says of each input travels (state, why)
      strips.forEach((s) => {
        const e = echo.find((x) => x.key === s.key && x.chan === s.chan) || echo.find((x) => x.key === s.key);
        if (e) { s.state = e.state; s.why = e.why; }
      });
    } else {
      // the echo wins; each strip keeps its page identity (same key + channel first, then the same key), so a strip
      // whose channel just changed is still the element that has the focus
      const used = new Set();
      const pick = (f) => { const s = strips.find((x) => !used.has(x.uid) && f(x)); if (s) used.add(s.uid); return s; };
      strips = echo.map((e) => {
        const s = pick((x) => x.key === e.key && x.chan === e.chan) || pick((x) => x.key === e.key);
        return Object.assign({ uid: s ? s.uid : ++uidSeq }, e);
      });
    }
    if (!pending) heldLive = null;       // still pending: the app's last LIST stands when the window ends (pendingOver)
    else if (echo) heldLive = lv;
    if (!onAir || !wanted) metersOff();  // (the drain: the microphones are closed -- no meter says they still hear)
    paintStrips();
    paintPicker();
    // listening starts: the idle fade may begin; it stops -- or starts FINISHING -- the deck comes back
    if (onAir !== was || wanted !== wasWanted) wake();
  }

  /* ---- the strips, painted. One element per strip, keyed by the page's uid and updated in place (a rebuild would
     take the focus from a name being typed and restart every transition). ---- */
  const stripEls = new Map();
  const stripOf = (uid) => strips.find((s) => s.uid === uid) || null;
  const mk = (tag, cls, text) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  };
  function buildStrip(uid) {
    const root = mk("div", "strip");
    root.setAttribute("role", "group");
    const lamp = mk("span", "strip-lamp");
    lamp.setAttribute("aria-hidden", "true");
    const name = mk("input", "strip-name");
    name.type = "text";
    name.setAttribute("type", "text");
    name.setAttribute("spellcheck", "false");
    name.setAttribute("autocomplete", "off");
    name.setAttribute("placeholder", "Speaker name");
    name.setAttribute("aria-label", "Speaker name");
    const x = mk("button", "strip-x", "×");
    x.type = "button";
    x.setAttribute("type", "button");
    const src = mk("div", "strip-src");
    const kind = mk("span", "strip-kind");
    const srcName = mk("span", "strip-src-name");
    src.appendChild(kind); src.appendChild(srcName);
    const why = mk("div", "strip-why");
    why.hidden = true;
    const ch = mk("select", "strip-ch");
    ch.setAttribute("aria-label", "Channel");
    const trim = mk("input", "strip-trim");
    trim.type = "range";
    trim.setAttribute("type", "range");
    trim.setAttribute("min", String(GAIN_MIN)); trim.setAttribute("max", String(GAIN_MAX));
    trim.setAttribute("step", String(GAIN_STEP));
    trim.setAttribute("aria-label", "Trim");
    trim.title = "Trim (double-click: 0 dB)";
    const db = mk("span", "strip-db");
    const meter = mk("div", "meter");
    meter.setAttribute("aria-hidden", "true");
    const fill = mk("span", "meter-fill"), peak = mk("span", "meter-peak");
    meter.appendChild(fill); meter.appendChild(peak);
    const head = mk("div", "strip-head"), ctl = mk("div", "strip-ctl");
    [lamp, name, x].forEach((c) => head.appendChild(c));
    [ch, trim, db].forEach((c) => ctl.appendChild(c));
    [head, src, why, ctl, meter].forEach((c) => root.appendChild(c));
    const n = { root, lamp, name, x, src, kind, srcName, why, ch, trim, db, meter, chSig: "" };

    // the speaker's name: Enter keeps it, Esc gives the old one back, leaving the field keeps it
    name.addEventListener("input", () => {
      if (utf8Len(name.value) > LABEL_MAX) name.value = fitBytes(name.value, LABEL_MAX);
    });
    name.addEventListener("keydown", (e) => {
      if (e.key === "Enter") { e.preventDefault(); commitName(uid); name.blur(); }
      else if (e.key === "Escape") { e.preventDefault(); const s = stripOf(uid); name.value = s ? s.label : ""; name.blur(); }
    });
    name.addEventListener("blur", () => commitName(uid));
    ch.addEventListener("change", () => setChannel(uid, parseInt(ch.value, 10)));
    trim.addEventListener("pointerdown", () => { dragUid = uid; });
    trim.addEventListener("input", () => trimInput(uid, trim.value));
    trim.addEventListener("change", () => trimCommit(uid, trim.value));
    trim.addEventListener("dblclick", () => trimCommit(uid, 0));
    x.addEventListener("click", () => removeStrip(uid));
    return n;
  }
  function commitName(uid) {
    const s = stripOf(uid), n = stripEls.get(uid);
    if (!s || !n) return;
    const v = cleanLabel(n.name.value) || defaultLabel(sourceName(s.key), s.chan);
    if (n.name.value !== v && document.activeElement !== n.name) n.name.value = v;
    if (v === s.label) return;
    commitStrips(strips.map((x) => (x.uid === uid ? Object.assign({}, x, { label: v }) : x)));
  }
  // Is this name still the one the page would have given (so it may follow the channel)? Against the source's
  // known name when there is one; else by its " · ch N" ending alone.
  function isDefaultName(s) {
    const known = sourceOf(s.key) || srcInfo.get(s.key);
    if (known && known.label) return s.label === defaultLabel(known.label, s.chan);
    return s.chan > 0 && s.label.endsWith(" · ch " + s.chan);
  }
  function setChannel(uid, chan) {
    const s = stripOf(uid);
    if (!s || !(chan >= 0 && chan <= MAX_CHAN) || chan === s.chan) { paintStrips(); return; }
    if (clash(strips, s.key, chan, uid)) { paintStrips(); return; }      // (the select never offers one)
    let label = s.label;
    if (isDefaultName(s)) {
      const known = sourceOf(s.key) || srcInfo.get(s.key);
      label = known && known.label ? defaultLabel(known.label, chan)
            : chan > 0 ? s.label.replace(/ · ch \d+$/, "") + " · ch " + chan : s.label.replace(/ · ch \d+$/, "");
    }
    // (lane: "" -- the echo's name was the OLD channel's; laneOf builds the new one until the next echo says it)
    commitStrips(strips.map((x) => (x.uid === uid ? Object.assign({}, x, { chan, label, lane: "" }) : x)));
  }
  // The trim: shown at once, sent at most every TRIM_SEND_MS while it moves, sent exactly when it is let go.
  function trimInput(uid, raw) {
    if (!stripOf(uid)) return;
    trimLive = { uid, v: clampGain(raw) };
    const n = stripEls.get(uid);
    if (n) n.db.textContent = fmtGain(trimLive.v);
    if (!trimTimer) trimTimer = setTimeout(() => {
      trimTimer = null;
      if (trimLive) sendTrim(trimLive.uid, trimLive.v, /*final=*/false);
    }, TRIM_SEND_MS);
  }
  function trimCommit(uid, raw) {
    if (trimTimer) { clearTimeout(trimTimer); trimTimer = null; }
    dragUid = 0;
    sendTrim(uid, clampGain(raw), /*final=*/true);
  }
  function sendTrim(uid, v, final) {
    if (final) trimLive = null;
    const s = stripOf(uid);
    if (!s) return;
    if (Math.abs(s.gainDb - v) < 0.05) { paintStrips(); return; }
    commitStrips(strips.map((x) => (x.uid === uid ? Object.assign({}, x, { gainDb: v }) : x)));
  }
  function removeStrip(uid) {
    if (!stripOf(uid)) return;
    if (trimLive && trimLive.uid === uid) trimLive = null;
    commitStrips(strips.filter((x) => x.uid !== uid));
    // the keyboard lands on the empty slot (the element it was on is gone)
    if (!el.addSource.disabled) el.addSource.focus();
  }
  function addStrip(key, chan) {
    const src = sourceOf(key);
    if (!src || src.state !== "ok" || strips.length >= MAX_STRIPS) return;
    if (!(chan >= 0 && chan <= MAX_CHAN) || clash(strips, key, chan, 0)) return;
    rememberSource(src);
    const s = { uid: ++uidSeq, key, label: defaultLabel(src.label, chan), chan, gainDb: 0, state: "", why: "" };
    commitStrips(strips.concat([s]));
    closePicker(/*refocus=*/false);
    // ...and straight into its scribble strip: the next thing to do is to name the speaker
    const n = stripEls.get(s.uid);
    if (n) { n.name.focus(); if (typeof n.name.select === "function") n.name.select(); }
  }

  // An input's state, as the engine says it (INPUT, carried by the app on each strip). "open" lights green only
  // while listening; a failure stays red after a stop, with its reason, until the next start says otherwise.
  const INPUT_WHY = { absent: "Not connected", busy: "In use by another program",
                      denied: "Blocked by Windows' privacy settings", unsupported: "Not supported on this Windows",
                      stalled: "No sound arriving", error: "Could not be opened" };
  const BAD_STATES = new Set(["busy", "denied", "unsupported", "error"]);
  function lampOf(s) {
    if (BAD_STATES.has(s.state)) return "is-bad";
    if (!onAir) return "";
    if (s.state === "open") return "is-open";
    if (s.state === "stalled") return "is-warn";
    if (s.state === "absent") return "is-absent";
    return "";
  }
  function whyOf(s) {
    if (s.state === "open" || !s.state) return "";
    if (!onAir && !BAD_STATES.has(s.state)) return "";
    return s.why || INPUT_WHY[s.state] || "";
  }
  function paintStrips() {
    const keep = new Set(strips.map((s) => s.uid));
    stripEls.forEach((n, uid) => {
      if (keep.has(uid)) return;
      n.root.remove(); stripEls.delete(uid); meters.delete(uid);
    });
    strips.forEach((s, i) => {
      let n = stripEls.get(s.uid);
      if (!n) { n = buildStrip(s.uid); stripEls.set(s.uid, n); }
      if (el.strips.children[i] !== n.root) el.strips.insertBefore(n.root, el.strips.children[i] || null);
      fillStrip(n, s);
    });
    const full = strips.length >= MAX_STRIPS;
    el.addSource.disabled = full;
    el.addSource.title = full ? "Up to " + MAX_STRIPS + " sources at once — remove one to add another"
                              : "Add an input, the sound of an output or an application";
    document.body.classList.toggle("no-strips", strips.length === 0);
    paintListen();
    fitDeck();
  }
  function fillStrip(n, s) {
    const label = s.label || defaultLabel(sourceName(s.key), s.chan);
    n.root.dataset.key = s.key;
    n.root.dataset.chan = String(s.chan);
    const lamp = lampOf(s);
    n.lamp.className = "strip-lamp" + (lamp ? " " + lamp : "");
    const why = whyOf(s);
    n.root.setAttribute("aria-label", label + (why ? " — " + why : onAir && s.state === "open" ? " — open" : ""));
    // the control under the user's hand keeps what he is doing
    if (document.activeElement !== n.name && n.name.value !== s.label) n.name.value = s.label;
    n.name.title = label + " — the speaker's name on the lines (Enter keeps it)";
    n.x.setAttribute("aria-label", "Remove " + label);
    n.x.title = "Remove this source";
    const k = kindOf(s.key), srcName = sourceName(s.key);
    n.kind.textContent = KIND_TAG[k] || "";
    n.srcName.textContent = srcName;
    n.src.title = (KINDS[k] || "Source") + ": " + srcName;
    n.why.textContent = why;
    n.why.hidden = !why;
    n.why.className = "strip-why" + (BAD_STATES.has(s.state) ? " is-bad" : "");
    paintChannels(n, s);
    const held = trimLive && trimLive.uid === s.uid;
    const g = held ? trimLive.v : s.gainDb;
    if (!held && dragUid !== s.uid && n.trim.value !== String(g)) n.trim.value = String(g);
    n.db.textContent = fmtGain(g);
    paintMeter(s.uid);
  }
  // The channel selector: the mix, then each channel of the device -- the ones another strip of the same device
  // holds (or all of them next to its mix) offered disabled, so the rule is visible where it bites.
  function paintChannels(n, s) {
    const known = channelsOf(s.key);
    const count = Math.max(known > 0 ? (known > 1 ? known : 0) : 2, s.chan);
    const opts = [[0, "Mix"]];
    for (let c = 1; c <= Math.min(MAX_CHAN, count); c++) opts.push([c, "Ch " + c]);
    const sig = opts.map(([c]) => c + (clash(strips, s.key, c, s.uid) ? "x" : "")).join(",");
    if (n.chSig !== sig) {
      n.ch.replaceChildren();
      opts.forEach(([c, t]) => {
        const o = mk("option", "", t);
        o.value = String(c);
        o.disabled = c !== s.chan && clash(strips, s.key, c, s.uid);
        n.ch.appendChild(o);
      });
      n.chSig = sig;
    }
    if (n.ch.value !== String(s.chan)) n.ch.value = String(s.chan);
    n.ch.title = known > 0 ? "The whole device (Mix), or one of its " + known + " channels"
                           : "The whole device (Mix), or one channel (open Add source once to list all of them)";
  }

  /* ---- THE METERS: liveLevels, -60..0 dBFS, peak hold 1.5 s, clip at -1 dBFS held 2 s; empty when the levels stop
     (STALE) and whenever the engine is not listening -- a meter frozen on its last value would say a microphone
     is still hearing something. Each strip reads ITS LANE's level (laneOf: TrPipe.h LANES) and nothing else -- two
     strips on two channels of one device have two meters; a channel strip never shows its device's mix. ---- */
  const METER_FLOOR_DB = -60, CLIP_DB = -1, PEAK_HOLD_MS = 1500, CLIP_HOLD_MS = 2000, LEVELS_STALE_MS = 1200;
  const meters = new Map();     // uid -> {x, pk, pkAt, clipAt, db}
  let staleTimer = null;
  const dbToX = (db) => Math.max(0, Math.min(1, (db - METER_FLOOR_DB) / -METER_FLOOR_DB));
  function levelFor(lv, s) {
    const own = Object.prototype.hasOwnProperty;
    const id = laneOf(s);
    const v = own.call(lv, id) ? lv[id] : undefined;
    if (v === undefined || v === null || v === "" || typeof v === "boolean") return null;
    const d = Number(v);
    return Number.isFinite(d) ? Math.max(-120, Math.min(24, d)) : null;
  }
  function applyLevels(msg) {
    if (!onAir || !wanted) return;            // levels only WHILE LISTENING (the director's rule; the drain is not)
    const lv = msg && msg.levels;
    if (!lv || typeof lv !== "object" || Array.isArray(lv)) return;
    const now = nowMs();
    strips.forEach((s) => {
      const db = levelFor(lv, s);
      if (db === null) return;
      const m = meters.get(s.uid) || { x: 0, pk: 0, pkAt: NaN, clipAt: NaN, db: -120 };
      m.x = dbToX(db);
      m.db = db;
      if (!(now - m.pkAt < PEAK_HOLD_MS) || m.x >= m.pk) { m.pk = m.x; m.pkAt = now; }
      if (db >= CLIP_DB) m.clipAt = now;
      meters.set(s.uid, m);
      paintMeter(s.uid);
    });
    if (staleTimer) clearTimeout(staleTimer);
    staleTimer = setTimeout(() => { staleTimer = null; metersOff(); }, LEVELS_STALE_MS);
  }
  function metersOff() {
    if (staleTimer) { clearTimeout(staleTimer); staleTimer = null; }
    meters.clear();
    strips.forEach((s) => paintMeter(s.uid));
  }
  function paintMeter(uid) {
    const n = stripEls.get(uid);
    if (!n) return;
    const m = meters.get(uid);
    const x = m ? m.x : 0, pk = m ? m.pk : 0;
    n.meter.style.setProperty("--lvl", x.toFixed(3));
    n.meter.style.setProperty("--pk", pk.toFixed(3));
    n.meter.classList.toggle("is-lit", !!m && pk > 0);
    n.meter.classList.toggle("is-clip", !!m && nowMs() - m.clipAt < CLIP_HOLD_MS);
    n.meter.title = m ? m.db.toFixed(1) + " dBFS" : "";
  }

  /* ---- LISTEN: the latch. Pressed = the page ASKS (liveListen); only the app's echo (translatorState.live.on) lights
     the button and the ON AIR lamp. Between the two the dot blinks (LISTEN_PENDING_MS at most). With no strip it
     still answers: a hint here, the app's own word after it, and the empty slot calls attention to itself. ---- */
  function endListenPending() {
    listenPending = null;
    if (listenTimer) { clearTimeout(listenTimer); listenTimer = null; }
  }
  let beckonTimer = null;
  function beckonAdd() {
    el.addSource.classList.add("is-beckon");
    if (beckonTimer) clearTimeout(beckonTimer);
    beckonTimer = setTimeout(() => { beckonTimer = null; el.addSource.classList.remove("is-beckon"); }, 1800);
  }
  function pressListen() {
    // against what is ASKED (ours in flight, else the app's wish): pressed again while starting = stop
    const want = !(listenPending ? listenPending.on : wanted);
    endListenPending();
    if (want && !strips.length) {
      beckonAdd();
      showAck("Add a source first.", false, 4000);
    } else {
      listenPending = { on: want };
      listenTimer = setTimeout(() => { listenTimer = null; listenPending = null; paintListen(); }, LISTEN_PENDING_MS);
    }
    paintListen();
    send({ type: "liveListen", on: want });
  }
  function paintListen() {
    // THE DRAIN (the ADDENDUM FIX ROUND): Listen pressed off, the engine still finishing (on && !wanted) -- the button is
    // UP (the microphones are closed: what the user asked), the ON AIR lamp BLINKS on its way off (a console's light that
    // is being released), and a press listens again (the engine resumes: LIVE 1 during the drain).
    const finishing = onAir && !wanted;
    el.listenBtn.setAttribute("aria-pressed", onAir && !finishing ? "true" : "false");
    // the dot blinks between the ask and the echo: ours in flight, or the app's wish the engine has not confirmed yet
    // (R4: live.wanted -- a start that loads models, a restart after the engine died)
    el.listenBtn.classList.toggle("is-pending", (!!listenPending && listenPending.on !== onAir) || wanted !== onAir);
    el.listenBtn.title = finishing ? "Listening stopped — finishing the last sentences (press to listen again)"
                       : onAir ? "Stop listening"
                       : strips.length ? "Listen to the sources above" : "Add a source first, then listen";
    el.onAir.classList.toggle("is-lit", onAir && !finishing);
    el.onAir.classList.toggle("is-finishing", finishing);
    document.body.classList.toggle("is-on-air", onAir && !finishing);
    paintState();
  }

  /* ---- THE PICKER ----
     Each opening asks the engine for its list (liveSources{}): the engine ENUMERATES, it opens nothing -- no
     microphone is opened before the user adds it and presses Listen. Rows that cannot be added say why. ---- */
  const SECTIONS = [["in", "Inputs", "No input found."],
                    ["out", "Sound of an output", "No output found."],
                    ["app", "Applications", "No application is playing sound right now."]];
  const SRC_STATES = new Set(["ok", "absent", "busy", "denied", "unsupported"]);
  function sourceFrom(x) {
    if (!x || typeof x !== "object") return null;
    const kind = String(x.kind || "").toLowerCase();
    const key = String(x.key || "");
    if (!(kind === "in" || kind === "out" || kind === "app") || kindOf(key) !== kind || key.length > 512) return null;
    const st = String(x.state || "").toLowerCase();
    const flags = new Set((Array.isArray(x.flags) ? x.flags : String(x.flags || "").split(","))
      .map((f) => String(f).trim().toLowerCase()).filter(Boolean));
    return { kind, key, label: cleanName(x.label, 120) || sourceName(key), state: SRC_STATES.has(st) ? st : "error",
             rate: Math.max(0, Number(x.rate) || 0), ch: Math.max(0, Math.min(64, parseInt(x.ch, 10) || 0)), flags };
  }
  function applySources(msg) {
    if (!msg || !Array.isArray(msg.list)) return;
    // The latest list to ARRIVE is the list: the app forwards whole lists in order, and an engine restart starts
    // `gen` again at 1 -- so gens are never compared across messages here.
    const first = !sources;
    sources = { gen: Number(msg.gen) || 0, list: msg.list.map(sourceFrom).filter(Boolean) };
    strips.forEach((s) => { const src = sourceOf(s.key); if (src) rememberSource(src); });
    paintStrips();
    paintPicker();
    if (first && !el.picker.hidden && document.activeElement === el.pickerClose) focusPick(0);
  }
  const SRC_WHY = { absent: "Not connected", busy: "In use by another program (exclusive mode)",
                    denied: "Windows blocks microphone access for desktop apps (Settings › Privacy › Microphone)",
                    error: "Unavailable" };
  // Can this source be added, and on which channel -- or why not. The default action: its mix when it is on no
  // strip yet, else its lowest free channel (a device already on channels).
  function addPlan(src) {
    if (strips.length >= MAX_STRIPS) return { chan: -1, why: "" };       // (said once, at the top)
    if (src.state !== "ok") {
      const why = src.state === "unsupported"
        ? (src.kind === "app" ? "Needs Windows 11 (or Windows 10 build 20348 or later)" : "Not supported")
        : SRC_WHY[src.state] || "Unavailable";
      return { chan: -1, why };
    }
    const mine = strips.filter((s) => s.key === src.key);
    if (!mine.length) return { chan: 0, why: "" };
    if (src.ch <= 1) return { chan: -1, why: "Already on a strip" };
    if (mine.some((s) => s.chan === 0))
      return { chan: -1, why: "Already on a strip as a whole (Mix) — set that strip to one channel to add another" };
    for (let c = 1; c <= Math.min(MAX_CHAN, src.ch); c++) if (!clash(strips, src.key, c, 0)) return { chan: c, why: "" };
    return { chan: -1, why: src.ch > 1 ? "Every channel is already on a strip" : "Already on a strip" };
  }
  function openPicker() {
    if (!el.picker.hidden) return;
    el.picker.hidden = false;
    el.addSource.setAttribute("aria-expanded", "true");
    send({ type: "liveSources" });
    paintPicker();
    focusPick(0);
    wake();
  }
  function closePicker(refocus) {
    if (el.picker.hidden) return;
    el.picker.hidden = true;
    el.addSource.setAttribute("aria-expanded", "false");
    if (refocus && !el.addSource.disabled) el.addSource.focus();
    // (fix round, RVB-7: the picker CLOSED -- the app stops asking the engine for lists nobody reads, a respawned
    // engine included; the next opening asks again)
    send({ type: "liveSources", open: false });
    wake();
  }
  const pickButtons = () => Array.from(el.pickerList.querySelectorAll(".pk-add, .pk-ch")).filter((b) => !b.disabled);
  function focusPick(i) {
    const b = pickButtons();
    if (b.length) b[Math.max(0, Math.min(b.length - 1, i))].focus(); else el.pickerClose.focus();
  }
  function paintPicker() {
    if (el.picker.hidden) return;
    const had = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.pick : "";
    const full = strips.length >= MAX_STRIPS;
    el.pickerNote.textContent = full ? "Up to " + MAX_STRIPS + " sources at once — remove one to add another."
                              : !sources ? "Looking for sources…" : "";
    el.pickerNote.hidden = !el.pickerNote.textContent;
    el.pickerList.replaceChildren();
    if (!sources) return;
    let refocus = null;
    SECTIONS.forEach(([kind, title, none]) => {
      const sec = mk("div", "pk-sec");
      sec.appendChild(mk("div", "pk-sec-title", title));
      const rows = sources.list.filter((x) => x.kind === kind).slice()
        .sort((a, b) => (a.state === "ok" ? 0 : 1) - (b.state === "ok" ? 0 : 1)
                     || (b.flags.has("default") ? 1 : 0) - (a.flags.has("default") ? 1 : 0)
                     || (b.flags.has("comm") ? 1 : 0) - (a.flags.has("comm") ? 1 : 0)
                     || a.label.localeCompare(b.label));
      if (!rows.length) sec.appendChild(mk("div", "pk-none", none));
      rows.forEach((src) => {
        const plan = addPlan(src);
        const row = mk("div", "pk-row" + (plan.chan < 0 ? " is-off" : ""));
        row.dataset.key = src.key;
        const add = mk("button", "pk-add");
        add.type = "button";
        add.setAttribute("type", "button");
        add.dataset.pick = src.key + "#" + plan.chan;
        add.disabled = plan.chan < 0;
        add.appendChild(mk("span", "pk-dot" + (src.state === "ok" ? "" : src.state === "absent" ? " is-off" : " is-bad")));
        add.appendChild(mk("span", "pk-name", src.label));
        if (src.flags.has("default")) add.appendChild(mk("span", "pk-badge", "Default"));
        if (src.flags.has("comm")) add.appendChild(mk("span", "pk-badge", "Communications"));
        add.title = plan.chan < 0 ? (plan.why || src.label)
                  : "Add " + src.label + (plan.chan > 0 ? " — channel " + plan.chan : "");
        add.addEventListener("click", () => addStrip(src.key, plan.chan));
        row.appendChild(add);
        if (plan.why) row.appendChild(mk("div", "pk-why", plan.why));
        // a device with several channels: each one on its own (inputs and outputs; an application is one stream)
        if (src.state === "ok" && !full && src.kind !== "app" && src.ch > 1) {
          const chips = mk("span", "pk-chips");
          chips.setAttribute("role", "group");
          chips.setAttribute("aria-label", "One channel of " + src.label);
          for (let c = 0; c <= Math.min(MAX_CHAN, src.ch); c++) {
            const b = mk("button", "pk-ch", c === 0 ? "Mix" : String(c));
            b.type = "button";
            b.setAttribute("type", "button");
            b.dataset.pick = src.key + "#" + c;
            b.disabled = clash(strips, src.key, c, 0);
            b.title = c === 0 ? "The whole device (all its channels summed)" : "Channel " + c + " alone";
            b.addEventListener("click", () => addStrip(src.key, c));
            chips.appendChild(b);
          }
          row.appendChild(chips);
        }
        sec.appendChild(row);
      });
      el.pickerList.appendChild(sec);
    });
    // a list pushed while the keyboard was on a row: back on the same row
    if (had) refocus = pickButtons().find((b) => b.dataset.pick === had);
    if (refocus) refocus.focus();
  }

  /* ---- the window's own state (RV4-7): its REAL always-on-top, as main.cpp read it back; absent = left as is ---- */
  function applyWindow(msg) {
    if (typeof msg.topmost === "boolean") { onTop = msg.topmost; paintPin(); }
  }

  function onMessage(data) {
    let msg = data;
    if (typeof data === "string") { try { msg = JSON.parse(data); } catch { return; } }
    if (!msg || typeof msg !== "object") return;
    if (msg.type === "translatorState") {
      // a Clear (from either side): a new session. The bare {cleared:true} carries nothing else to read.
      if (msg.cleared === true) clearLog();
      if (typeof msg.running !== "boolean" && !msg.status && !msg.live) return;
      const p0 = pair();
      const models = msg.models;
      trState = { running: !!msg.running, status: String(msg.status || ""),
                  preset: String(msg.preset || ""), presetReq: String(msg.presetReq || ""),
                  asr: asrLabel(models && typeof models === "object" ? models.asr : models),
                  mt: models && typeof models === "object" ? shortModel(models.mt) : "",
                  gpu: !!msg.gpu, err: String(msg.err || ""),
                  // THE ENGINE'S ECHO WINS over whatever this window optimistically painted: a code the engine could
                  // not honour never appears in it (TrPipe.h), so the bar never advertises a pair that is not running.
                  mode: String(msg.mode || trState.mode || "auto"),
                  langA: normLang(msg.langA) || "en",
                  langB: normLang(msg.langB) || "zh",
                  sessionLines: Number(msg.sessionLines) || 0,
                  spkOn: !!(msg.spk && msg.spk.on), speakers: Math.max(0, Number(msg.spk && msg.spk.speakers) || 0) };
      // (a string `models` from an older sender: its first half is the ASR, the rest the MT)
      if (typeof models === "string" && models.indexOf(" · ") > 0) {
        trState.asr = asrLabel(models.slice(0, models.indexOf(" · ")));
        trState.mt = shortModel(models.slice(models.indexOf(" · ") + 3).split(" ")[0]);
      }
      noteEngineRunning(trState.running);
      if (msg.live && typeof msg.live === "object") applyLive(msg.live);
      paintState();
      paintBar();
      paintPreset();
      paintExport();
      // The pair moving changes what "show A" MEANS: the log is re-painted in the language now asked for. Guarded: a
      // state arrives on every status tick, and re-rendering the dialogue that often would be the flash §7 avoids.
      const p1 = pair();
      if (show !== "both" && (p0.a !== p1.a || p0.b !== p1.b)) renderLog();
      // NOT wake(): idle means the READER is idle, not the conversation (an error still shows: it pins itself).
    } else if (msg.type === "translatorLine") {
      const spk = (typeof msg.spk === "object" && msg.spk) || {};
      const line = { t: msg.t, lang: String(msg.lang || ""), src: String(msg.src || ""),
                     dst: String(msg.dst || ""), ms: Number(msg.ms) || 0,
                     waitMs: Number(msg.waitMs) || 0,
                     segId: segIdOf(msg.segId),   // "" = finishes no live segment
                     // retained, not merely rendered: a display-language switch re-paints the log from these
                     dstLang: String(msg.dstLang || ""), pass: !!msg.pass,
                     // W3: which sentence of its utterance this is, and whether it is the last
                     seq: Number(msg.seq) || 0, closes: closesOf(msg),
                     spk: { key: String(spk.key || ""), label: cleanName(spk.label, 80),
                            color: colorOf(spk.color) } };
      const id = identity(line);
      if (seen.has(id)) return;           // the reload replay: apply each line at most once
      seen.add(id);
      lines.push(line);
      if (lines.length > MAX) lines.splice(0, lines.length - MAX).forEach((d) => seen.delete(identity(d)));
      // The draft has become the thing itself -- unless it does NOT close its utterance (W3): then the live line
      // survives with its committed sentence cut off the front. A final for a DIFFERENT segment leaves it alone.
      if (line.segId && live && live.segId === line.segId) {
        if (line.closes) liveClear();
        else             liveTrimHead(line);
      }
      const host = liveLift();
      appendLine(line);
      liveDrop(host);
      if (pinned) pin();
      refreshResume();
    } else if (msg.type === "translatorPartial") {
      applyPartial(msg);                  // replace-in-place, silent for the resume pill
    } else if (msg.type === "translatorEnd") {
      applyEnd(msg);                      // the live line falls, and nothing is appended
    } else if (msg.type === "translatorExported") {
      // THREE outcomes, two worth a word: ok -> the file name alone (the user chose the folder); err -> the app's
      // sentence, in the error style and for longer; err=cancelled -> NOTHING (they closed the dialog).
      if (msg.ok) {
        const p = String(msg.path || "");
        showAck("Saved · " + cleanName(p.split(/[\\/]/).pop() || p, 120), false, 4000);
      } else if (String(msg.err || "") !== "cancelled") {
        showAck("Export failed — " + (cleanNotice(msg.err) || "unknown error"), true, 6000);
      }
    } else if (msg.type === "liveSources") {
      applySources(msg);
    } else if (msg.type === "liveLevels") {
      applyLevels(msg);
    } else if (msg.type === "translatorWindow") {
      applyWindow(msg);
    } else if (msg.type === "warn") {
      const t = cleanNotice(msg.text);
      if (t) showAck(t, true, 6000);
    }
  }
  if (hasWebView) window.chrome.webview.addEventListener("message", (e) => onMessage(e.data));

  /* ---- THE TRANSLATE ROW AND THE BAR (1.1.0 W2) -------------------------------------------------------------
     Two kinds of thing: "Translate" steers the ENGINE (every change goes out as translatorCtl and comes back as a
     STATE echo, which wins); "Show" and "Text" steer THIS WINDOW and are never sent anywhere. */
  const DIRS = [["auto", "⇄"], ["a2b", "→"], ["b2a", "←"]];
  const PRESETS = [["auto", "Auto"], ["quality", "Quality"], ["balanced", "Balanced"], ["light", "Light"]];
  function fillSelect(sel) {
    sel.replaceChildren();
    TR_LANGS.forEach(([code]) => {
      const o = document.createElement("option");
      o.value = code; o.textContent = langName(code);      // U1: "日本語 (Japanese)"
      sel.appendChild(o);
    });
  }
  // The deck wraps on a narrow window and grows with the strips; the log's top gutter has to follow it, or the first
  // paragraph sits underneath it. Measured, never guessed (a ResizeObserver where there is one, and after each paint).
  function fitDeck() {
    let h = 0;
    try { h = Math.round(el.deck.getBoundingClientRect().height); } catch { /* no layout */ }
    if (h > 0) document.documentElement.style.setProperty("--deck-h", h + "px");
  }
  function paintBar() {
    const p = pair();
    el.langA.value = p.a;
    el.langB.value = p.b;
    el.langA.title = langName(p.a);            // (U1: a narrow deck cuts a long name short -- the whole of it)
    el.langB.title = langName(p.b);
    const mode = DIRS.some(([v]) => v === trState.mode) ? trState.mode : "auto";
    const glyph = (DIRS.find(([v]) => v === mode) || DIRS[0])[1];
    if (el.dirBtn.textContent !== glyph) el.dirBtn.textContent = glyph;
    el.dirBtn.title = mode === "auto"
      ? "Both ways — the language of each sentence is detected (click for " + langName(p.a)
        + " → " + langName(p.b) + " only)"
      : mode === "a2b"
        ? langName(p.a) + " → " + langName(p.b) + " only (click for the other way round)"
        : langName(p.b) + " → " + langName(p.a) + " only (click for both ways)";
    // the same three states, spelled out (the wide layout; the narrow one keeps the glyph alone)
    [[el.modeAuto, "auto", "Both ways", "Both ways — the language of each sentence is detected"],
     [el.modeA2B, "a2b", codeTag(p.a) + " → " + codeTag(p.b), langName(p.a) + " → " + langName(p.b) + " only"],
     [el.modeB2A, "b2a", codeTag(p.b) + " → " + codeTag(p.a), langName(p.b) + " → " + langName(p.a) + " only"]]
      .forEach(([b, v, txt, tip]) => {
        if (b.textContent !== txt) b.textContent = txt;
        b.title = tip;
        b.classList.toggle("is-on", mode === v);
        b.setAttribute("aria-pressed", mode === v ? "true" : "false");
      });
    // (U1: the segments say the bare native name -- the deck stays one row --, their tooltips the whole "日本語 (Japanese)")
    const lab = { both: "Both", a: langNative(p.a), b: langNative(p.b) };
    const full = { a: langName(p.a), b: langName(p.b) };
    [[el.showBoth, "both"], [el.showA, "a"], [el.showB, "b"]].forEach(([b, v]) => {
      b.textContent = lab[v];
      b.classList.toggle("is-on", show === v);
      b.setAttribute("aria-pressed", show === v ? "true" : "false");
      b.title = v === "both"
        ? "Show the translation with the original underneath"
        : "Show only " + full[v] + " — one line per sentence";
    });
    // A longer language name can be what tips a row onto a second line, so the gutter is re-measured here too.
    fitDeck();
  }
  // The preset: what the user ASKED for when he did (presetReq), else what runs; Auto says what it chose.
  function paintPreset() {
    const has = (v) => PRESETS.some(([x]) => x === v);
    const want = has(trState.presetReq) ? trState.presetReq : has(trState.preset) ? trState.preset : "balanced";
    if (el.presetSel.value !== want) el.presetSel.value = want;
    const ran = PRESETS.find(([x]) => x === trState.preset);
    el.presetSel.title = "The models' preset — Quality is slower and more accurate, Light is for a computer without "
      + "a GPU to spare, Auto picks for this computer" + (want === "auto" && ran && ran[0] !== "auto"
        ? " (it chose " + ran[1] + ")" : "") + ". Shared with the player.";
  }
  // A pair travels WHOLE (half of it is a change the engine throws away), and the same language on both halves is
  // refused by SWAPPING rather than by an error: asking for "A = 繁體中文" while B is already 繁體中文 can only mean
  // "put them the other way round". A half that is NOT a code ("" from the normaliser) is never sent.
  function pickPair(which, code) {
    if (!code) { paintBar(); return; }
    const p = pair();
    const a  = which === "a" ? code : (code === p.a ? p.b : p.a);
    const b  = which === "a" ? (code === p.b ? p.a : p.b) : code;
    if (!a || !b || a === b) { paintBar(); return; }   // nothing (sendable) to ask for
    const moved = (a !== p.a || b !== p.b);
    // Optimistic, and overwritten by the engine's echo on the next STATE.
    trState = { ...trState, langA: a, langB: b };
    paintBar();
    if (moved && show !== "both") renderLog();
    send({ type: "translatorCtl", langA: a, langB: b });
  }
  function setMode(next) {
    if (next === trState.mode) return;                 // nothing changed: nothing travels
    trState = { ...trState, mode: next };              // optimistic; the STATE echo is the truth
    paintBar();
    send({ type: "translatorCtl", mode: next });
  }
  function applyShow(v, persist) {
    if (!(v === "a" || v === "b" || v === "both") || v === show) return;
    show = v;
    if (persist) write(KEY_SHOW, v);
    paintBar();
    renderLog();
    if (pinned) pin();
  }
  const setShow = (v) => applyShow(v, /*persist=*/true);
  fillSelect(el.langA); fillSelect(el.langB);
  el.langA.addEventListener("change", () => pickPair("a", normLang(el.langA.value)));
  el.langB.addEventListener("change", () => pickPair("b", normLang(el.langB.value)));
  el.dirBtn.addEventListener("click", () => {
    const i = DIRS.findIndex(([v]) => v === trState.mode);
    setMode(DIRS[(i < 0 ? 0 : i + 1) % DIRS.length][0]);
  });
  [[el.modeAuto, "auto"], [el.modeA2B, "a2b"], [el.modeB2A, "b2a"]].forEach(([b, v]) => {
    b.addEventListener("click", () => setMode(v));
  });
  el.presetSel.addEventListener("change", () => {
    const v = el.presetSel.value;
    if (!PRESETS.some(([x]) => x === v)) { paintPreset(); return; }
    if (v === (trState.presetReq || trState.preset)) return;   // nothing changed: nothing travels
    trState = { ...trState, presetReq: v };            // optimistic; the STATE echo is the truth
    paintPreset();
    send({ type: "translatorCtl", preset: v });
  });
  [[el.showBoth, "both"], [el.showA, "a"], [el.showB, "b"]].forEach(([b, v]) => {
    b.addEventListener("click", () => setShow(v));
  });

  /* ---- the window's controls ---- */
  function paintPin() {
    el.pinToggle.classList.toggle("is-on", onTop);
    el.pinToggle.setAttribute("aria-pressed", onTop ? "true" : "false");
  }
  function paintThemeBtn() {
    const t = themeNow() === "light" ? "Dark theme" : "Light theme";
    el.themeBtn.title = t;
    el.themeBtn.setAttribute("aria-label", t);
  }
  function setTheme(t) {
    applyTheme(t);
    write(THEME_KEY, t);          // ...and the player follows (the storage event)
    paintThemeBtn();
  }
  el.fontDown.addEventListener("click", () => bumpFont(-2));
  el.fontUp.addEventListener("click", () => bumpFont(+2));
  el.clearBtn.addEventListener("click", () => { clearLog(); send({ type: "translatorCtl", clear: true }); });
  // `format` travels EXPLICITLY even though the app defaults to docx: the day another format is added, a surface that
  // had been relying on the default would silently change format.
  el.exportBtn.addEventListener("click", () => send({ type: "translatorExport", format: "docx" }));
  el.pinToggle.addEventListener("click", () => {
    onTop = !onTop;
    paintPin();
    // translatorCtl{alwaysOnTop}: the native window (SetWindowPos HWND_TOPMOST); its REAL state comes back as
    // translatorWindow{topmost} and wins (RV4-7)
    send({ type: "translatorCtl", alwaysOnTop: onTop });
  });
  el.themeBtn.addEventListener("click", () => setTheme(themeNow() === "light" ? "dark" : "light"));
  el.resume.addEventListener("click", () => { pinned = true; pin(); refreshResume(); el.log.focus(); });
  el.log.addEventListener("scroll", () => { pinned = atBottom(); refreshResume(); });
  el.listenBtn.addEventListener("click", pressListen);
  el.addSource.addEventListener("click", () => { if (el.picker.hidden) openPicker(); else closePicker(true); });
  el.pickerClose.addEventListener("click", () => closePicker(true));
  // the picker by the keyboard: arrows move between the rows (and their channels), Esc closes it
  el.picker.addEventListener("keydown", (e) => {
    if (e.key === "Escape") { e.preventDefault(); closePicker(true); return; }
    if (e.key !== "ArrowDown" && e.key !== "ArrowUp") return;
    const b = pickButtons(), i = b.indexOf(document.activeElement);
    e.preventDefault();
    focusPick(i < 0 ? 0 : i + (e.key === "ArrowDown" ? 1 : -1));
  });
  // ...and a press anywhere else closes it
  const inside = (node, root) => { for (let n = node; n; n = n.parentNode) if (n === root) return true; return false; };
  window.addEventListener("pointerdown", (e) => {
    if (!el.picker.hidden && !inside(e.target, el.picker) && !inside(e.target, el.addSource)) closePicker(false);
  });
  window.addEventListener("pointerup", () => { dragUid = 0; });
  window.addEventListener("pointercancel", () => { dragUid = 0; });

  // Ctrl+wheel = zoom the dialogue, the gesture every reader already knows.
  window.addEventListener("wheel", (e) => {
    if (!e.ctrlKey) return;
    e.preventDefault();
    bumpFont(e.deltaY < 0 ? +2 : -2);
  }, { passive: false });

  const typing = (t) => !!t && t.tagName === "INPUT" && String(t.type || "").toLowerCase() === "text";
  window.addEventListener("keydown", (e) => {
    // Fix round (RVB-14): the deck has FADED while the keyboard was on one of its controls (Listen pressed from the
    // keyboard, then 3 s of reading): the key that wakes it only wakes it -- Space / Enter must not act on a control the
    // user cannot see (stop the listening, remove a strip). The next key acts, on a deck in sight.
    const asleep = el.deck.classList.contains("is-idle");
    wake();
    if (asleep && inside(e.target, el.deck)) { e.preventDefault(); return; }
    // a name being typed keeps its keys (End, Ctrl+-...): they are the text field's
    if (typing(e.target)) return;
    if (e.key === "Escape" && !el.picker.hidden) { e.preventDefault(); closePicker(true); }
    else if (e.ctrlKey && (e.key === "+" || e.key === "=")) { e.preventDefault(); bumpFont(+2); }
    else if (e.ctrlKey && e.key === "-") { e.preventDefault(); bumpFont(-2); }
    // RV4-8: by the PHYSICAL key -- on AZERTY the top-row 0 types "à" without Shift, so e.key is "à"
    else if (e.ctrlKey && (e.code === "Digit0" || e.code === "Numpad0" || e.key === "0")) { e.preventDefault(); font = 28; applyFont(); write(KEY_FONT, font); pin(); }
    else if (e.key === "End") { pinned = true; pin(); refreshResume(); }
  });

  /* ---- the idle fade: after a few still seconds the window is only the conversation -- WHILE LISTENING. Not while
     the picker is open or a name is being typed (the deck would fade under the hand), and not when nothing is
     listening (there is nothing to read, and Listen must stay in sight). The ON AIR tally stays. ---- */
  const IDLE_MS = 3000;
  let idleTimer = null;
  // (not while FINISHING either: the window is saying "Finishing the last sentences…", and that must be read)
  const idleAllowed = () => onAir && wanted && el.picker.hidden && !typing(document.activeElement);
  function wake() {
    el.deck.classList.remove("is-idle");
    el.state.classList.remove("is-idle");
    if (idleTimer) clearTimeout(idleTimer);
    idleTimer = setTimeout(() => {
      idleTimer = null;
      if (!idleAllowed()) return;
      el.deck.classList.add("is-idle");
      el.state.classList.add("is-idle");
    }, IDLE_MS);
  }
  ["pointermove", "pointerdown", "focusin"].forEach((t) => window.addEventListener(t, wake));
  // Resizing can change how many rows the deck takes; the gutter follows. Deliberately NOT a wake: the reader has
  // not moved, the window has.
  window.addEventListener("resize", fitDeck);
  try { if (typeof ResizeObserver === "function") new ResizeObserver(fitDeck).observe(el.deck); } catch { /* none */ }

  /* =====================================================================
     Design-time mock (browser dev only — never runs inside WebView2).
     It plays the app AND the engine, so the whole window can be watched in a plain browser: two strips on one
     interface (channel 1 and 2: "Me" and "Guest" -- the user's own setup), the picker's list, Listen, the meters,
     and 1.1.0's scripted meeting spoken by the strips. The address's #fragment sets the scene for a screenshot:
     #listen (listening at once), #empty (no strip), #picker (the picker open), #light / #dark (the theme), #awake
     (the deck never fades: a reader who keeps moving).
     ===================================================================== */
  const mock = (() => {
    const UR = "in:{0.0.1.00000000}.{3c1e5a20-mock-iface}";
    const LIST = [
      { kind: "in", key: UR, label: "Line (Studio Interface)", state: "ok", rate: 48000, ch: 6, flags: "default" },
      { kind: "in", key: "in:{0.0.1.00000000}.{mock-headset}", label: "Headset Microphone (Jabra Evolve2 65)",
        state: "ok", rate: 16000, ch: 1, flags: "comm" },

        state: "ok", rate: 48000, ch: 2, flags: "" },
      { kind: "in", key: "in:{0.0.1.00000000}.{mock-array}", label: "Microphone Array (Realtek(R) Audio)",
        state: "denied", rate: 48000, ch: 2, flags: "" },
      { kind: "out", key: "out:{0.0.0.00000000}.{mock-speakers}", label: "Speakers (Realtek(R) Audio)",
        state: "ok", rate: 48000, ch: 2, flags: "default" },
      { kind: "out", key: "out:{0.0.0.00000000}.{mock-headset}", label: "Headset Earphone (Jabra Evolve2 65)",
        state: "ok", rate: 48000, ch: 2, flags: "comm" },
      { kind: "app", key: "app:Zoom.exe", label: "Zoom Meetings", state: "ok", rate: 48000, ch: 2, flags: "" },
      { kind: "app", key: "app:ms-teams.exe", label: "Microsoft Teams", state: "ok", rate: 48000, ch: 2, flags: "" },
      { kind: "app", key: "app:firefox.exe", label: "Firefox", state: "ok", rate: 48000, ch: 2, flags: "" },
    ];
    const hash = String((window.location && window.location.hash) || "");
    let mStrips = /empty/.test(hash) ? [] : [{ key: UR, label: "Me", chan: 1, gainDb: 0 },
                                             { key: UR, label: "Guest", chan: 2, gainDb: 3 }];
    let mOn = false, mGen = 0, mLines = 0;
    let mA = "fr", mB = "en", mMode = "auto", mPreset = "balanced";
    let i = 0, timer = null, levelTimer = null, talker = -1;
    /* 1.1.0's scripted meeting (§7 streaming, W3 several finals in one utterance, an END, an abandoned partial),
       spoken by the STRIPS: `who` is a strip's position, its name and colour are the strip's. */
    const script = [
      { who: 0, lang: "en", src: "Right, let's set the levels before we start.",
        dst: "Bon, réglons les niveaux avant de commencer.", ms: 620, waitMs: 3200, stream: true,
        draft: "Bon, réglons les niveaux", revise: "Right, let's set the lever before" },
      { who: 0, lang: "en", src: "Give me a steady tone on channel three.",
        dst: "Envoie-moi un signal stable sur la voie trois.", ms: 579, waitMs: 2900 },
      { who: 1, lang: "fr", src: "D'accord, la voie trois est envoyée.",
        dst: "Sure — channel three is sending now.", ms: 480, waitMs: 1840, stream: true, draft: "Right, channel three" },
      { who: 0, lang: "en", src: "Perfect, that's minus eighteen.", dst: "Parfait, ça fait moins dix-huit.", ms: 510, waitMs: 2400 },
      { who: 1, lang: "fr", src: "Le niveau est un peu bas, je monte de trois décibels.",
        dst: "The level is a little low — I'll push it three dB.", ms: 660, waitMs: 2100 },
      { who: 0, lang: "en", stream: true, sentences: [
          { src: "Right, the room is ready.", dst: "Bon, la salle est prête.", ms: 610, waitMs: 1150, lead: "Let's start" },
          { src: "Let's start with the drum stems.", dst: "Commençons par les stems de batterie.",
            ms: 640, waitMs: 1210, lead: "Then we", draft: "Commençons par" },
          { src: "Then we print the mix.", dst: "Ensuite on exporte le mix.", ms: 590, waitMs: 1080 },
        ] },
      { who: 1, lang: "fr", stream: true, end: true, tail: "Euh…", sentences: [
          { src: "Le niveau est bon maintenant.", dst: "The level is set now.", ms: 470, waitMs: 980, lead: "Euh" },
        ] },
      { who: 0, lang: "en", src: "Agreed, so let's — actually, hold on", ms: 0, abandon: true, stream: true },
    ];
    const liveOf = () => ({ on: mOn, wanted: mOn,
      inputs: mStrips.map((s) => Object.assign({}, s, { lane: laneRule(s.key, s.chan), state: mOn ? "open" : "" })) });
    const state = (status) => onMessage({ type: "translatorState", running: true, status, preset: mPreset,
      presetReq: mPreset, models: { asr: "small→large-v3-turbo", mt: "Qwen3-4B-Instruct-2507-Q5_K_M.gguf" }, gpu: true,
      mode: mMode, langA: mA, langB: mB, sessionLines: mLines, spk: { on: true, model: "campplus", speakers: 2 },
      live: liveOf() });
    const spkOf = (who, lang) => {
      const s = mStrips[who % Math.max(1, mStrips.length)] || { key: "x", label: "Speaker", chan: 0 };
      // the app's speaker key without a voiceprint: {lane, language}; slot = the lane (TrPipe.h LANES)
      const lane = laneRule(s.key, s.chan);
      return { key: lane + "|" + lang, slot: lane, label: s.label, color: who % 6 };
    };
    const line = (o) => { mLines++; onMessage(o); };
    const other = (lang) => (lang === mB ? mA : mB);
    const grow = (text, revise) => {
      const t = String(text || ""), spaced = /\s/.test(t);
      const parts = spaced ? t.split(/\s+/) : t.split(""), step = spaced ? 2 : 3, out = [];
      for (let k = step; k < parts.length; k += step) out.push(parts.slice(0, k).join(spaced ? " " : ""));
      if (revise) out.splice(Math.max(0, out.length - 1), 0, String(revise));
      out.push(t);
      return out;
    };
    const PART_MS = 600;
    const next = (gap) => { talker = -1; state("listening"); i++; timer = setTimeout(tick, gap); };
    function commitSteps(s, seg) {
      const steps = [];
      const part = (src, dst) => steps.push(() =>
        onMessage({ type: "translatorPartial", segId: seg, t: Date.now(), lang: s.lang, src,
                    ...(dst ? { dst, dstLang: other(s.lang) } : {}) }));
      const last = s.sentences.length - 1;
      s.sentences.forEach((snt, k) => {
        const join  = /\s/.test(snt.src) ? " " : "";
        const carry = k ? String(s.sentences[k - 1].lead || "") : "";
        grow(snt.src).forEach((g) => { if (g.length > carry.length) part(g, snt.draft); });
        if (snt.lead) part(snt.src + join + snt.lead, snt.draft);
        steps.push(() => {
          line({ type: "translatorLine", t: Date.now(), segId: seg, lang: s.lang,
                      src: snt.src, dst: snt.dst, dstLang: other(s.lang),
                      ms: snt.ms, waitMs: snt.waitMs, seq: k + 1,
                      closes: k === last && !s.end, spk: spkOf(s.who, s.lang) });
          if (snt.lead)
            onMessage({ type: "translatorPartial", segId: seg, t: Date.now(), lang: s.lang, src: snt.lead });
        });
      });
      if (s.end) { part(String(s.tail || "")); steps.push(() =>
        onMessage({ type: "translatorEnd", segId: seg })); }
      return steps;
    }
    function tick() {
      if (!mOn || !mStrips.length) return;
      const s = script[i % script.length];
      const seg = i + 1;
      talker = s.who % mStrips.length;
      state("transcribing");
      if (s.sentences) {
        const steps = commitSteps(s, seg);
        let k = 0;
        const beat = () => {
          steps[k]();
          if (++k < steps.length) { timer = setTimeout(beat, PART_MS); return; }
          next(2600);
        };
        beat();
        return;
      }
      const final = () => {
        line({ type: "translatorLine", t: Date.now(), segId: seg, lang: s.lang, src: s.src,
               dst: s.dst, dstLang: other(s.lang), ms: s.ms, waitMs: s.waitMs, spk: spkOf(s.who, s.lang) });
        next(2600);
      };
      if (!s.stream) { timer = setTimeout(final, 1200); return; }
      const words = grow(s.src, s.revise);
      const draftFrom = Math.floor(words.length * 0.6);
      let k = 0;
      const step = () => {
        onMessage({ type: "translatorPartial", segId: seg, t: Date.now(), lang: s.lang, src: words[k],
                    ...(k >= draftFrom && s.draft ? { dst: s.draft, dstLang: other(s.lang) } : {}) });
        if (++k < words.length) { timer = setTimeout(step, PART_MS); return; }
        if (s.abandon) { next(23000); return; }
        timer = setTimeout(final, 900);
      };
      step();
    }
    // the meters: the talker near -14 dBFS, everyone else at the room's floor, five times a second
    function levels() {
      if (!mOn) return;
      const lv = {};
      mStrips.forEach((s, k) => {
        const db = (k === talker ? -16 + Math.random() * 13 : -54 + Math.random() * 8) + (Number(s.gainDb) || 0);
        lv[laneRule(s.key, s.chan)] = Math.round(db * 10) / 10;   // keyed by LANE, as the engine names them
      });
      onMessage({ type: "liveLevels", levels: lv });
      levelTimer = setTimeout(levels, 200);
    }
    function listen(on) {
      if (on && !mStrips.length) { onMessage({ type: "warn", text: "Add a source first." }); return; }
      mOn = on;
      if (timer) { clearTimeout(timer); timer = null; }
      if (levelTimer) { clearTimeout(levelTimer); levelTimer = null; }
      talker = -1;
      state("listening");
      if (on) { timer = setTimeout(tick, 900); levels(); }
    }
    function start() {
      const th = /light/.test(hash) ? "light" : /dark/.test(hash) ? "dark" : "";
      if (th) { applyTheme(th); paintThemeBtn(); }
      onMessage({ type: "translatorWindow", topmost: true });
      if (/awake/.test(hash)) { const keep = () => { wake(); setTimeout(keep, 1000); }; keep(); }
      state("loading");
      setTimeout(() => {
        state("listening");
        if (/listen/.test(hash)) listen(true);
        if (/picker/.test(hash)) openPicker();
      }, 400);
    }
    function handle(msg) {
      if (!msg) return;
      if (msg.type === "translatorExport") {
        // a fake path: a mock that wrote a file would be a mock with teeth
        setTimeout(() => onMessage({ type: "translatorExported", ok: true,
          path: "C:\\Users\\me\\Documents\\SuVtitle Live 2026-10-25 15-40.docx", lines: mLines }), 700);
        return;
      }
      if (msg.type === "liveSources") {
        if (msg.open === false) return;          // (the picker closed: nothing to answer)
        setTimeout(() => onMessage({ type: "liveSources", gen: ++mGen, list: LIST }), 250);
        return;
      }
      if (msg.type === "liveListen") { listen(!!msg.on); return; }
      if (msg.type === "liveConfig") {
        // the app's own rules: <= 4, one key twice only on two different channels >= 1
        const ins = Array.isArray(msg.inputs) ? msg.inputs : [];
        const bad = ins.length > MAX_STRIPS || ins.some((a, k) => ins.some((b, j) => j < k && a.key === b.key
          && (a.chan === b.chan || !a.chan || !b.chan)));
        if (bad) onMessage({ type: "warn", text: "That source is already on a strip." });
        else mStrips = ins.map((x) => ({ key: x.key, label: x.label, chan: x.chan, gainDb: x.gainDb }));
        if (mOn && !mStrips.length) listen(false); else state("listening");
        return;
      }
      if (msg.type !== "translatorCtl") return;
      // the echo a real engine would send -- refusing a degenerate pair, as the engine does
      if (typeof msg.langA === "string" && typeof msg.langB === "string"
          && msg.langA !== msg.langB) { mA = msg.langA; mB = msg.langB; }
      if (typeof msg.mode === "string" && msg.mode) mMode = msg.mode;
      if (typeof msg.preset === "string" && msg.preset) mPreset = msg.preset;
      if (typeof msg.alwaysOnTop === "boolean") onMessage({ type: "translatorWindow", topmost: msg.alwaysOnTop });
      if (msg.clear) {
        if (timer) clearTimeout(timer);
        i = 0; mLines = 0; timer = mOn ? setTimeout(tick, 600) : null;   // a Clear ENDS the session
      }
      state("listening");
    }
    return { start, handle };
  })();

  paintState();
  paintBar();
  paintPreset();
  paintExport();
  paintStrips();
  paintPin();
  paintThemeBtn();
  refreshResume();
  wake();
  if (hasWebView) send({ type: "ready" });   // the app answers with the state, the last lines, the window
  else mock.start();
})();
</script>
</body>
